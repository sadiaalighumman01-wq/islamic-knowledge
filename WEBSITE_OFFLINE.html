ic:`بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ`,textEnglish:`In the name of Allah, the Entirely Merciful, the Especially Merciful.`,textUrdu:`اللہ کے نام سے جو بڑا مہربان نہایت رحم والا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001001.mp3`},{numberInSurah:2,textArabic:`الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ`,textEnglish:`[All] praise is [due] to Allah, Lord of the worlds -`,textUrdu:`سب تعریف اللہ ہی کے لیے ہے جو تمام جہانوں کا پالنے والا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001002.mp3`},{numberInSurah:3,textArabic:`الرَّحْمَٰنِ الرَّحِيمِ`,textEnglish:`The Entirely Merciful, the Especially Merciful,`,textUrdu:`بہت مہربان، نہایت رحم فرمانے والا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001003.mp3`},{numberInSurah:4,textArabic:`مَالِكِ يَوْمِ الدِّينِ`,textEnglish:`Sovereign of the Day of Recompense.`,textUrdu:`روزِ جزا کا مالک ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001004.mp3`},{numberInSurah:5,textArabic:`إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ`,textEnglish:`It is You we worship and You we ask for help.`,textUrdu:`ہم تیری ہی عبادت کرتے ہیں اور تجھ ہی سے مدد مانگتے ہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001005.mp3`},{numberInSurah:6,textArabic:`اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ`,textEnglish:`Guide us to the straight path -`,textUrdu:`ہمیں سیدھے راستے کی ہدایت فرما۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001006.mp3`},{numberInSurah:7,textArabic:`صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ`,textEnglish:`The path of those upon whom You have bestowed favor, not of those who have evoked [Your] anger or of those who are astray.`,textUrdu:`ان لوگوں کا راستہ جن پر تو نے انعام فرمایا، نہ ان کا جن پر غضب ہوا اور نہ گمراہوں کا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/001007.mp3`}]},{number:2,nameArabic:`البقرة`,nameEnglish:`Al-Baqarah`,englishTranslation:`The Cow`,revelationType:`Medinan`,ayahCount:286,bismillahPre:!0,summary:`The longest surah in the Quran, providing comprehensive guidance on law, worship, financial ethics, and the preservation of faith.`,ayahs:[{numberInSurah:1,textArabic:`الم`,textEnglish:`Alif, Lam, Meem.`,textUrdu:`الم (الف لام میم)۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002001.mp3`},{numberInSurah:2,textArabic:`ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ`,textEnglish:`This is the Book about which there is no doubt, a guidance for those conscious of Allah -`,textUrdu:`یہ وہ کتاب ہے جس میں کوئی شک نہیں، پرہیزگاروں کے لیے ہدایت ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002002.mp3`},{numberInSurah:3,textArabic:`الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ`,textEnglish:`Who believe in the unseen, establish prayer, and spend out of what We have provided for them,`,textUrdu:`جو غیب پر ایمان لاتے ہیں، نماز قائم کرتے ہیں اور جو کچھ ہم نے دیا اس میں سے خرچ کرتے ہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002003.mp3`},{numberInSurah:255,textArabic:`اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ`,textEnglish:`Allah - there is no deity except Him, the Ever-Living, the Sustainer of all existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that could intercede with Him except by His permission? He knows what is before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great. (Ayat al-Kursi)`,textUrdu:`اللہ کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ اور سب کا نگہبان ہے۔ اسے نہ اونگھ آتی ہے نہ نیند۔ جو کچھ آسمانوں اور زمین میں ہے سب اسی کا ہے۔ کون ہے جو اس کی اجازت کے بغیر اس کے پاس سفارش کرے؟ وہ جانتا ہے جو ان کے آگے ہے اور جو ان کے پیچھے، اور وہ اس کے علم میں سے کسی چیز کا احاطہ نہیں کر سکتے مگر جتنا وہ چاہے۔ اس کی کرسی آسمانوں اور زمین کو گھیرے ہوئے ہے، اور ان کی حفاظت اسے نہیں تھکاتی، وہ بلند و برتر ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002255.mp3`},{numberInSurah:285,textArabic:`آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ`,textEnglish:`The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allah and His angels and His books and His messengers, [saying], 'We make no distinction between any of His messengers.' And they say, 'We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination.'`,textUrdu:`رسول اس پر ایمان لایا جو اس کے رب کی طرف سے نازل ہوا اور مومن بھی۔ سب اللہ پر، اس کے فرشتوں، اس کی کتابوں اور اس کے رسولوں پر ایمان لائے، کہ ہم اس کے رسولوں میں تفریق نہیں کرتے۔ اور انہوں نے کہا: ہم نے سنا اور اطاعت کی، اے ہمارے رب! تیری بخشش چاہتے ہیں اور تیری ہی طرف لوٹنا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002285.mp3`},{numberInSurah:286,textArabic:`لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ`,textEnglish:`Allah does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. 'Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.'`,textUrdu:`اللہ کسی جان پر اس کی طاقت سے زیادہ بوجھ نہیں ڈالتا۔ اس نے جو نیکی کمائی وہ اسی کے لیے ہے اور جو برائی کی وہ اسی کے ذمے ہے۔ اے ہمارے رب! اگر ہم بھول جائیں یا چوک جائیں تو ہمارا مواخذہ نہ فرما، اور ہم پر ایسا بوجھ نہ ڈال جیسا ہم سے اگلوں پر ڈالا تھا۔ اور ہم پر وہ بوجھ نہ ڈال جس کی ہمیں طاقت نہ ہو۔ اور ہم سے درگزر فرما، ہمیں بخش دے اور ہم پر رحم فرما، تو ہی ہمارا کارساز ہے، پس کافروں پر ہماری مدد فرما۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/002286.mp3`}]},{number:3,nameArabic:`آل عمران`,nameEnglish:`Ali 'Imran`,englishTranslation:`Family of Imran`,revelationType:`Medinan`,ayahCount:200,bismillahPre:!0,summary:`Highlights the unity of monotheistic message, the stories of Maryam and Isa (Jesus), and lessons from the Battle of Uhud.`,ayahs:[{numberInSurah:18,textArabic:`شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ ۚ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ`,textEnglish:`Allah witnesses that there is no deity except Him, and [so do] the angels and those of knowledge - [that He is] maintaining [creation] in justice. There is no deity except Him, the Exalted in Might, the Wise.`,textUrdu:`اللہ نے گواہی دی کہ اس کے سوا کوئی معبود نہیں اور فرشتوں نے بھی اور اہل علم نے بھی، وہ عدل کے ساتھ نظام قائم رکھنے والا ہے، اس غالب اور حکمت والے کے سوا کوئی معبود نہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/003018.mp3`},{numberInSurah:144,textArabic:`وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ الرُّسُلُ ۚ أَفَإِن مَّاتَ أَوْ قُتِلَ انقَلَبْتُمْ عَلَىٰ أَعْقَابِكُمْ`,textEnglish:`Muhammad is not but a messenger. [Other] messengers have passed on before him. So if he was to die or be killed, would you turn back on your heels?`,textUrdu:`اور محمد (ﷺ) تو محض ایک رسول ہیں، ان سے پہلے بھی بہت سے رسول گزر چکے ہیں۔ تو کیا اگر وہ وفات پا جائیں یا شہید کر دیے جائیں تو تم الٹے پاؤں پھر جاؤ گے؟`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/003144.mp3`}]},{number:18,nameArabic:`الكهف`,nameEnglish:`Al-Kahf`,englishTranslation:`The Cave`,revelationType:`Meccan`,ayahCount:110,bismillahPre:!0,summary:`Recited on Fridays for protection from the trials of the Antichrist (Dajjal). Narrates the Sleepers of the Cave, Musa and Khidr, and Dhul-Qarnayn.`,ayahs:[{numberInSurah:1,textArabic:`الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا`,textEnglish:`[All] praise is [due] to Allah, who has sent down upon His Servant the Book and has not made therein any deviance.`,textUrdu:`سب تعریف اللہ ہی کے لیے ہے جس نے اپنے بندے پر کتاب نازل فرمائی اور اس میں کوئی ٹیڑھ نہیں رکھی۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/018001.mp3`},{numberInSurah:10,textArabic:`إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا`,textEnglish:`[Mention] when the youths retreated to the cave and said, 'Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.'`,textUrdu:`جب ان نوجوانوں نے غار میں پناہ لی تو کہا: اے ہمارے رب! ہمیں اپنے پاس سے رحمت عطا فرما اور ہمارے معاملے میں ہمارے لیے ہدایت کا سامان مہیا فرما۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/018010.mp3`},{numberInSurah:110,textArabic:`قُلْ إِنَّمَا أَنَا بَشَرٌ مِّثْلُكُمْ يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا`,textEnglish:`Say, 'I am only a man like you, to whom has been revealed that your god is one God. So whoever would hope for the meeting with his Lord - let him do righteous work and not associate in the worship of his Lord anyone.'`,textUrdu:`فرما دیجیے: میں تو تمہاری طرح کا ایک بشر ہوں، میری طرف وحی کی جاتی ہے کہ تمہارا معبود صرف ایک ہی معبود ہے۔ پس جو شخص اپنے رب کی ملاقات کی امید رکھتا ہو اسے چاہیے کہ نیک عمل کرے اور اپنے رب کی عبادت میں کسی کو شریک نہ ٹھہرائے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/018110.mp3`}]},{number:36,nameArabic:`يس`,nameEnglish:`Ya-Sin`,englishTranslation:`Ya-Sin`,revelationType:`Meccan`,ayahCount:83,bismillahPre:!0,summary:`Known as the Heart of the Quran, emphasizing divine revelation, resurrection, accountability, and Allah's sovereign majesty in creation.`,ayahs:[{numberInSurah:1,textArabic:`يس`,textEnglish:`Ya, Seen.`,textUrdu:`یس (یاسین)۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/036001.mp3`},{numberInSurah:2,textArabic:`وَالْقُرْآنِ الْحَكِيمِ`,textEnglish:`By the wise Qur'an.`,textUrdu:`حکمت سے بھرپور قرآن کی قسم۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/036002.mp3`},{numberInSurah:3,textArabic:`إِنَّكَ لَمِنَ الْمُرْسَلِينَ`,textEnglish:`Indeed you, [O Muhammad], are from among the messengers,`,textUrdu:`بے شک آپ رسولوں میں سے ہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/036003.mp3`},{numberInSurah:82,textArabic:`إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ`,textEnglish:`His command is only when He intends a thing that He says to it, 'Be,' and it is.`,textUrdu:`اس کا حکم تو بس یہ ہے کہ جب وہ کسی چیز کا ارادہ فرماتا ہے تو اسے کہتا ہے 'ہو جا' اور وہ ہو جاتی ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/036082.mp3`}]},{number:55,nameArabic:`الرحمن`,nameEnglish:`Ar-Rahman`,englishTranslation:`The Beneficent`,revelationType:`Medinan`,ayahCount:78,bismillahPre:!0,summary:`Celebrates the boundless bounties of Allah granted to humans and jinns, framed by the majestic refrain: 'Which of the favors of your Lord will you deny?'`,ayahs:[{numberInSurah:1,textArabic:`الرَّحْمَٰنُ`,textEnglish:`The Most Merciful`,textUrdu:`نہایت مہربان خدا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/055001.mp3`},{numberInSurah:2,textArabic:`عَلَّمَ الْقُرْآنَ`,textEnglish:`Taught the Qur'an,`,textUrdu:`اسی نے قرآن سکھایا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/055002.mp3`},{numberInSurah:3,textArabic:`خَلَقَ الْإِنسَانَ`,textEnglish:`Created man,`,textUrdu:`اسی نے انسان کو پیدا کیا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/055003.mp3`},{numberInSurah:13,textArabic:`فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ`,textEnglish:`So which of the favors of your Lord would you deny?`,textUrdu:`پس تم اپنے رب کی کون کون سی نعمتوں کو جھٹلاؤ گے؟`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/055013.mp3`}]},{number:67,nameArabic:`الملك`,nameEnglish:`Al-Mulk`,englishTranslation:`The Sovereignty`,revelationType:`Meccan`,ayahCount:30,bismillahPre:!0,summary:`Surah Al-Mulk shields from the punishment of the grave, directing our attention to the flawless celestial architecture and sovereignty of the Almighty.`,ayahs:[{numberInSurah:1,textArabic:`تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ`,textEnglish:`Blessed is He in whose hand is dominion, and He is over all things competent -`,textUrdu:`بڑی برکت والی ہے وہ ذات جس کے ہاتھ میں ساری بادشاہت ہے اور وہ ہر چیز پر قادر ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/067001.mp3`},{numberInSurah:2,textArabic:`الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ`,textEnglish:`[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving -`,textUrdu:`جس نے موت اور زندگی کو پیدا کیا تاکہ تمہیں آزمائے کہ تم میں سے عمل کے لحاظ سے کون بہتر ہے، اور وہ زبردست بخشنے والا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/067002.mp3`}]},{number:93,nameArabic:`الضحى`,nameEnglish:`Ad-Duha`,englishTranslation:`The Morning Hours`,revelationType:`Meccan`,ayahCount:11,bismillahPre:!0,summary:`A tender, comforting surah revealed to the Prophet (ﷺ) bringing reassurance that Allah has not abandoned him, reminding of previous mercies.`,ayahs:[{numberInSurah:1,textArabic:`وَالضُّحَىٰ`,textEnglish:`By the morning brightness`,textUrdu:`قسم ہے چاشت کے وقت کی!`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/093001.mp3`},{numberInSurah:2,textArabic:`وَاللَّيْلِ إِذَا سَجَىٰ`,textEnglish:`And [by] the night when it covers with darkness,`,textUrdu:`اور قسم ہے رات کی جب وہ چھا جائے!`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/093002.mp3`},{numberInSurah:3,textArabic:`مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ`,textEnglish:`Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you].`,textUrdu:`آپ کے رب نے نہ آپ کو چھوڑا اور نہ وہ ناراض ہوا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/093003.mp3`},{numberInSurah:4,textArabic:`وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ`,textEnglish:`And the Hereafter is better for you than the first [life].`,textUrdu:`اور یقیناً آخرت آپ کے لیے دنیا سے کہیں بہتر ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/093004.mp3`},{numberInSurah:5,textArabic:`وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ`,textEnglish:`And your Lord is going to give you, and you will be satisfied.`,textUrdu:`اور عنقریب آپ کا رب آپ کو اتنا دے گا کہ آپ راضی ہو جائیں گے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/093005.mp3`}]},{number:94,nameArabic:`الشرح`,nameEnglish:`Ash-Sharh`,englishTranslation:`The Relief`,revelationType:`Meccan`,ayahCount:8,bismillahPre:!0,summary:`Reassures that with every hardship comes ease, reminding believers to direct their strivings solely towards their Creator.`,ayahs:[{numberInSurah:1,textArabic:`أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ`,textEnglish:`Did We not expand for you, [O Muhammad], your breast?`,textUrdu:`کیا ہم نے آپ کے لیے آپ کا سینہ کشادہ نہیں فرما دیا؟`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/094001.mp3`},{numberInSurah:5,textArabic:`فَإِنَّ مَعَ الْعُسْرِ يُسْرًا`,textEnglish:`For indeed, with hardship [will be] ease.`,textUrdu:`پس بے شک تنگی کے ساتھ آسانی ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/094005.mp3`},{numberInSurah:6,textArabic:`إِنَّ مَعَ الْعُسْرِ يُسْرًا`,textEnglish:`Indeed, with hardship [will be] ease.`,textUrdu:`یقیناً تنگی کے ساتھ آسانی ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/094006.mp3`}]},{number:97,nameArabic:`القدر`,nameEnglish:`Al-Qadr`,englishTranslation:`The Night of Decree`,revelationType:`Meccan`,ayahCount:5,bismillahPre:!0,summary:`Honors Laylat al-Qadr, the majestic night in Ramadan when the Quran was first sent down, celebrated as better than a thousand months.`,ayahs:[{numberInSurah:1,textArabic:`إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ`,textEnglish:`Indeed, We sent the Qur'an down during the Night of Decree.`,textUrdu:`بے شک ہم نے اسے شب قدر میں نازل فرمایا۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/097001.mp3`},{numberInSurah:2,textArabic:`وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ`,textEnglish:`And what can make you know what is the Night of Decree?`,textUrdu:`اور آپ کو کیا معلوم کہ شب قدر کیا ہے؟`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/097002.mp3`},{numberInSurah:3,textArabic:`لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ`,textEnglish:`The Night of Decree is better than a thousand months.`,textUrdu:`شب قدر ہزار مہینوں سے بہتر ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/097003.mp3`},{numberInSurah:4,textArabic:`تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ`,textEnglish:`The angels and the Spirit descend therein by permission of their Lord for every matter.`,textUrdu:`اس میں فرشتے اور روح القدس اپنے رب کے حکم سے ہر معاملے کے لیے نازل ہوتے ہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/097004.mp3`},{numberInSurah:5,textArabic:`سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ`,textEnglish:`Peace it is until the emergence of dawn.`,textUrdu:`یہ رات سراسر سلامتی ہے، فجر کے طلوع ہونے تک۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/097005.mp3`}]},{number:103,nameArabic:`العصر`,nameEnglish:`Al-'Asr`,englishTranslation:`The Declining Day`,revelationType:`Meccan`,ayahCount:3,bismillahPre:!0,summary:`Imam Ash-Shafi'i noted that if only this Surah was revealed, it would suffice humanity as a roadmap for salvation through faith, righteousness, and mutual truth.`,ayahs:[{numberInSurah:1,textArabic:`وَالْعَصْرِ`,textEnglish:`By time,`,textUrdu:`قسم ہے زمانے کی!`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/103001.mp3`},{numberInSurah:2,textArabic:`إِنَّ الْإِنسَانَ لَفِي خُسْرٍ`,textEnglish:`Indeed, mankind is in loss,`,textUrdu:`بے شک انسان سراسر خسارے میں ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/103002.mp3`},{numberInSurah:3,textArabic:`إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ`,textEnglish:`Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience.`,textUrdu:`سوائے ان لوگوں کے جو ایمان لائے اور نیک عمل کیے اور ایک دوسرے کو حق کی وصیت کی اور صبر کی تلقین کی۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/103003.mp3`}]},{number:108,nameArabic:`الكوثر`,nameEnglish:`Al-Kawthar`,englishTranslation:`Abundance`,revelationType:`Meccan`,ayahCount:3,bismillahPre:!0,summary:`The shortest surah in the Quran, bestowing divine solace to the Prophet (ﷺ) with the promise of the River of Abundance in Paradise.`,ayahs:[{numberInSurah:1,textArabic:`إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ`,textEnglish:`Indeed, We have granted you, [O Muhammad], al-Kawthar.`,textUrdu:`بے شک ہم نے آپ کو کوثر (بے شمار خیر) عطا فرمائی۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/108001.mp3`},{numberInSurah:2,textArabic:`فَصَلِّ لِرَبِّكَ وَانْحَرْ`,textEnglish:`So pray to your Lord and sacrifice [to Him alone].`,textUrdu:`پس آپ اپنے رب کے لیے نماز پڑھیں اور قربانی کریں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/108002.mp3`},{numberInSurah:3,textArabic:`إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ`,textEnglish:`Indeed, your enemy is the one cut off.`,textUrdu:`بے شک آپ کا دشمن ہی بے نام و نشان رہنے والا ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/108003.mp3`}]},{number:112,nameArabic:`الإخلاص`,nameEnglish:`Al-Ikhlas`,englishTranslation:`The Sincerity`,revelationType:`Meccan`,ayahCount:4,bismillahPre:!0,summary:`Equivalent to one-third of the Quran in virtue, it defines pure, absolute Monotheism (Tawheed) without equal or counterpart.`,ayahs:[{numberInSurah:1,textArabic:`قُلْ هُوَ اللَّهُ أَحَدٌ`,textEnglish:`Say, 'He is Allah, [who is] One,`,textUrdu:`کہہ دیجیے کہ وہ اللہ ایک ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/112001.mp3`},{numberInSurah:2,textArabic:`اللَّهُ الصَّمَدُ`,textEnglish:`Allah, the Eternal Refuge.`,textUrdu:`اللہ بے نیاز (سب کا سہارا) ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/112002.mp3`},{numberInSurah:3,textArabic:`لَمْ يَلِدْ وَلَمْ يُولَدْ`,textEnglish:`He neither begets nor is born,`,textUrdu:`نہ اس کی کوئی اولاد ہے اور نہ وہ کسی کی اولاد ہے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/112003.mp3`},{numberInSurah:4,textArabic:`وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ`,textEnglish:`Nor is there to Him any equivalent.'`,textUrdu:`اور کوئی اس کا ہمسر نہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/112004.mp3`}]},{number:113,nameArabic:`الفلق`,nameEnglish:`Al-Falaq`,englishTranslation:`The Daybreak`,revelationType:`Meccan`,ayahCount:5,bismillahPre:!0,summary:`The first of the two protective surahs (Al-Mu'awwidhatayn), seeking divine refuge from the malice of created things, darkness, sorcery, and envy.`,ayahs:[{numberInSurah:1,textArabic:`قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ`,textEnglish:`Say, 'I seek refuge in the Lord of daybreak`,textUrdu:`کہہ دیجیے: میں صبح کے رب کی پناہ مانگتا ہوں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/113001.mp3`},{numberInSurah:2,textArabic:`مِن شَرِّ مَا خَلَقَ`,textEnglish:`From the evil of that which He created`,textUrdu:`ہر اس چیز کی برائی سے جو اس نے پیدا کی،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/113002.mp3`},{numberInSurah:3,textArabic:`وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ`,textEnglish:`And from the evil of darkness when it settles`,textUrdu:`اور اندھیری رات کی برائی سے جب وہ چھا جائے،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/113003.mp3`},{numberInSurah:4,textArabic:`وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ`,textEnglish:`And from the evil of the blowers in knots`,textUrdu:`اور گرہوں میں پھونکنے والیوں کی برائی سے،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/113004.mp3`},{numberInSurah:5,textArabic:`وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ`,textEnglish:`And from the evil of an envier when he envies.'`,textUrdu:`اور حسد کرنے والے کی برائی سے جب وہ حسد کرے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/113005.mp3`}]},{number:114,nameArabic:`الناس`,nameEnglish:`An-Nas`,englishTranslation:`Mankind`,revelationType:`Meccan`,ayahCount:6,bismillahPre:!0,summary:`The final chapter of the Holy Quran, invoking the Lord, King, and God of mankind against the stealthy whispers of Satan and negative impulses.`,ayahs:[{numberInSurah:1,textArabic:`قُلْ أَعُوذُ بِرَبِّ النَّاسِ`,textEnglish:`Say, 'I seek refuge in the Lord of mankind,`,textUrdu:`کہہ دیجیے: میں انسانوں کے رب کی پناہ مانگتا ہوں،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114001.mp3`},{numberInSurah:2,textArabic:`مَلِكِ النَّاسِ`,textEnglish:`The Sovereign of mankind,`,textUrdu:`جو انسانوں کا حقیقی بادشاہ ہے،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114002.mp3`},{numberInSurah:3,textArabic:`إِلَٰهِ النَّاسِ`,textEnglish:`The God of mankind,`,textUrdu:`انسانوں کا معبودِ برحق،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114003.mp3`},{numberInSurah:4,textArabic:`مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ`,textEnglish:`From the evil of the retreating whisperer -`,textUrdu:`پیچھے ہٹ جانے والے وسوسہ ڈالنے والے کے شر سے،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114004.mp3`},{numberInSurah:5,textArabic:`الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ`,textEnglish:`Who whispers into the breasts of mankind -`,textUrdu:`جو لوگوں کے دلوں میں وسوسے ڈالتا ہے،`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114005.mp3`},{numberInSurah:6,textArabic:`مِنَ الْجِنَّةِ وَالنَّاسِ`,textEnglish:`From among the jinn and mankind.'`,textUrdu:`خواہ وہ جنات میں سے ہو یا انسانوں میں سے۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/114006.mp3`}]}],bt=[{number:1,nameEnglish:`Al-Fatihah`,nameArabic:`الفاتحة`,englishTranslation:`The Opening`,ayahCount:7,revelationType:`Meccan`},{number:2,nameEnglish:`Al-Baqarah`,nameArabic:`البقرة`,englishTranslation:`The Cow`,ayahCount:286,revelationType:`Medinan`},{number:3,nameEnglish:`Ali 'Imran`,nameArabic:`آل عمران`,englishTranslation:`Family of Imran`,ayahCount:200,revelationType:`Medinan`},{number:4,nameEnglish:`An-Nisa`,nameArabic:`النساء`,englishTranslation:`The Women`,ayahCount:176,revelationType:`Medinan`},{number:5,nameEnglish:`Al-Ma'idah`,nameArabic:`المائدة`,englishTranslation:`The Table Spread`,ayahCount:120,revelationType:`Medinan`},{number:6,nameEnglish:`Al-An'am`,nameArabic:`الأنعام`,englishTranslation:`The Cattle`,ayahCount:165,revelationType:`Meccan`},{number:7,nameEnglish:`Al-A'raf`,nameArabic:`الأعراف`,englishTranslation:`The Heights`,ayahCount:206,revelationType:`Meccan`},{number:8,nameEnglish:`Al-Anfal`,nameArabic:`الأنفال`,englishTranslation:`The Spoils of War`,ayahCount:75,revelationType:`Medinan`},{number:9,nameEnglish:`At-Tawbah`,nameArabic:`التوبة`,englishTranslation:`The Repentance`,ayahCount:129,revelationType:`Medinan`},{number:10,nameEnglish:`Yunus`,nameArabic:`يونس`,englishTranslation:`Jonah`,ayahCount:109,revelationType:`Me :`الفيل`,englishTranslation:`The Elephant`,ayahCount:5,revelationType:`Meccan`},{number:106,nameEnglish:`Quraysh`,nameArabic:`قريش`,englishTranslation:`Quraysh`,ayahCount:4,revelationType:`Meccan`},{number:107,nameEnglish:`Al-Ma'un`,nameArabic:`الماعون`,englishTranslation:`The Small Kindnesses`,ayahCount:7,revelationType:`Meccan`},{number:108,nameEnglish:`Al-Kawthar`,nameArabic:`الکوثر`,englishTranslation:`Abundance`,ayahCount:3,revelationType:`Meccan`},{number:109,nameEnglish:`Al-Kafirun`,nameArabic:`الكافرون`,englishTranslation:`The Disbelievers`,ayahCount:6,revelationType:`Meccan`},{number:110,nameEnglish:`An-Nasr`,nameArabic:`النصر`,englishTranslation:`The Divine Support`,ayahCount:3,revelationType:`Medinan`},{number:111,nameEnglish:`Al-Masad`,nameArabic:`المسد`,englishTranslation:`The Palm Fiber`,ayahCount:5,revelationType:`Meccan`},{number:112,nameEnglish:`Al-Ikhlas`,nameArabic:`الإخلاص`,englishTranslation:`The Sincerity`,ayahCount:4,revelationType:`Meccan`},{number:113,nameEnglish:`Al-Falaq`,nameArabic:`الفلق`,englishTranslation:`The Daybreak`,ayahCount:5,revelationType:`Meccan`},{number:114,nameEnglish:`An-Nas`,nameArabic:`الناس`,englishTranslation:`Mankind`,ayahCount:6,revelationType:`Meccan`}],xt=e=>{let t=yt.find(t=>t.number===e);if(t)return t;let n=bt.find(t=>t.number===e)||bt[0];return{number:n.number,nameArabic:n.nameArabic,nameEnglish:n.nameEnglish,englishTranslation:n.englishTranslation,revelationType:n.revelationType,ayahCount:n.ayahCount,bismillahPre:n.number!==9,summary:`Surah ${n.nameEnglish} (${n.englishTranslation}) was revealed in ${n.revelationType===`Meccan`?`Makkah`:`Madinah`} and contains ${n.ayahCount} verses of divine wisdom and guidance.`,ayahs:[{numberInSurah:1,textArabic:n.nameArabic.length>5?`الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ`:`بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ`,textEnglish:`Opening verse of Surah ${n.nameEnglish}. Guidance, remembrance, and enlightenment for the faithful.`,textUrdu:`سورۃ ${n.nameEnglish} کی ابتدائی آیات، فلاح اور ہدایت کا روشن سرچشمہ۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/${String(n.number).padStart(3,`0`)}001.mp3`},{numberInSurah:2,textArabic:`إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ`,textEnglish:`Indeed in that are signs for a people who give thought.`,textUrdu:`بے شک اس میں غور و فکر کرنے والوں کے لیے نشانیاں ہیں۔`,audioUrl:`https://everyayah.com/data/Alafasy_128kbps/${String(n.number).padStart(3,`0`)}002.mp3`}]}},j={surahNumber:2,surahNameEnglish:`Al-Baqarah`,surahNameArabic:`البقرة`,ayahNumber:255,textArabic:`اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ`,translationEnglish:`Allah - there is no deity except Him, the Ever-Living, the Sustainer of all existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth.`,translationUrdu:`اللہ کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ اور سب کا نگہبان ہے۔ اسے نہ اونگھ آتی ہے نہ نیند۔ جو کچھ آسمانوں اور زمین میں ہے سب اسی کا ہے۔`,theme:`Ayat al-Kursi (The Throne Verse)`},St=[`Morning & Evening`,`Before Sleeping`,`After Prayer`,`Protection`,`Travel`,`Food`,`Forgiveness`,`Anxiety & Difficulties`,`Parents`,`Knowledge`,`Health`,`Daily Life`],Ct=[{id:`sayyidul-istighfar`,title:`Sayyidul Istighfar (The Master Supplication for Forgiveness)`,arabic:`اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ`,transliteration:`Allahumma Anta Rabbi, la ilaha illa Anta, khalaqtani wa ana 'abduka, wa ana 'ala 'ahdika wa wa'dika mastata'tu, a'udhu bika min sharri ma sana'tu, abu'u laka bini'matika 'alayya, wa abu'u bidhanbi faghfir li, fa-innahu la yaghfirudh-dhunuba illa Anta.`,translationEnglish:`O Allah, You are my Lord, there is no deity worthy of worship except You. You created me and I am Your servant, and I abide by Your covenant and promise as best as I can. I seek refuge in You from the evil of what I have committed. I acknowledge Your favors upon me and I confess my sins, so forgive me, for none forgives sins except You.`,translationUrdu:`اے اللہ! تو ہی میرا رب ہے، تیرے سوا کوئی معبود نہیں، تو نے ہی مجھے پیدا کیا اور میں تیرا بندہ ہوں، اور میں اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ میں اپنے کیے کے شر سے تیری پناہ مانگتا ہوں، اپنے اوپر تیری نعمتوں کا اعتراف کرتا ہوں اور اپنے گناہوں کا اقرار کرتا ہوں، پس مجھے بخش دے کیونکہ تیرے سوا کوئی گناہوں کو بخشنے والا نہیں۔`,category:`Morning & Evening`,reference:`Sahih al-Bukhari 6306`,benefit:`The Prophet (ﷺ) said whoever recites this during the day or night with conviction and passes away will be among the people of Jannah.`},{id:`morning-protection`,title:`Morning Remembrance for Blessings of the Day`,arabic:`أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ`,transliteration:`Asbahna wa-asbahal-mulku lillah, walhamdu lillah, la ilaha illallahu wahdahu la sharika lahu, lahul-mulku wa lahul-hamdu wa Huwa 'ala kulli shay'in Qadeer.`,translationEnglish:`We have reached the morning and the dominion belongs to Allah, and all praise is due to Allah. None has the right to be worshipped except Allah alone, without partner. To Him belongs the dominion and to Him is praise, and He is over all things omnipotent.`,translationUrdu:`ہم نے اور تمام بادشاہت نے اللہ کے لیے صبح کی، اور تمام تعریفیں اللہ ہی کے لیے ہیں۔ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے اور اسی کے لیے تعریف ہے، اور وہ ہر چیز پر قادر ہے۔`,category:`Morning & Evening`,reference:`Sahih Muslim 2723`,benefit:`Brings calmness, gratitude, and divine protection throughout daylight.`},{id:`before-sleeping-bismika`,title:`Supplication Before Sleeping`,arabic:`بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ`,transliteration:`Bismika Rabbi wada'tu janbi, wa bika arfa'uh, fa-in amsakta nafsi farhamha, wa-in arsaltaha fahfadh-ha bima tahfadhu bihi 'ibadakas-salihin.`,translationEnglish:`In Your name my Lord, I lie down, and by Your favor I rise. If You should take my soul, have mercy upon it, and if You should release it, protect it with that by which You protect Your righteous servants.`,translationUrdu:`تیرے نام کے ساتھ اے میرے رب! میں نے اپنا پہلو رکھا اور تیرے ہی سہارے میں اسے اٹھاؤں گا۔ اگر تو میری جان روک لے تو اس پر رحم فرما، اور اگر چھوڑ دے تو اس کی ویسے ہی حفاظت فرما جیسے تو اپنے نیک بندوں کی کرتا ہے۔`,category:`Before Sleeping`,reference:`Sahih al-Bukhari 6320 & Muslim 2714`,benefit:`Protects the sleeper and entrusts the soul into the guardian care of Allah.`},{id:`sleep-allahumma-bismika`,title:`Short Dua Before Sleep`,arabic:`بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا`,transliteration:`Bismika Allahumma amootu wa-ahya.`,translationEnglish:`In Your Name, O Allah, I die and I live.`,translationUrdu:`اے اللہ! تیرے نام کے ساتھ ہی میں مرتا (سوتا) ہوں اور جیتا (جاگتا) ہوں۔`,category:`Before Sleeping`,reference:`Sahih al-Bukhari 6324`,benefit:`The Prophet (ﷺ) recited this every night when resting upon his right side.`},{id:`after-salah-taslim`,title:`Remembrance Directly After Finishing Salah`,arabic:`أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ`,transliteration:`Astaghfirullah, Astaghfirullah, Astaghfirullah. Allahumma Antas-Salamu wa minkas-salam, tabarakta ya Dhal-Jalali wal-Ikram.`,translationEnglish:`I ask Allah for forgiveness (three times). O Allah, You are Peace and from You comes peace. Blessed are You, O Owner of majesty and honor.`,translationUrdu:`میں اللہ سے بخشش طلب کرتا ہوں (تین بار)۔ اے اللہ! تو سراپا سلامتی ہے اور سلامتی تیری ہی طرف سے ہے، تو بڑی برکت والا ہے، اے جلال اور بزرگی والے!`,category:`After Prayer`,reference:`Sahih Muslim 591`,benefit:`Sunnah remembrance after giving Tasleem.`},{id:`after-salah-kursi`,title:`Ayat al-Kursi After Obligatory Prayers`,arabic:`اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ`,transliteration:`Allahu la ilaha illa Huwal-Hayyul-Qayyum...`,translationEnglish:`Allah - there is no deity except Him, the Ever-Living, the Sustainer of all existence...`,translationUrdu:`اللہ کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ اور سب کا نگہبان ہے...`,category:`After Prayer`,reference:`Sunan an-Nasa'i (Al-Kubra 9848) - Authenticated by Al-Albani`,benefit:`The Prophet (ﷺ) said: Whoever recites Ayat al-Kursi after every obligatory prayer, nothing prevents him from entering Paradise except death.`},{id:`protection-evil-creation`,title:`Protection from All Harm and Created Evil`,arabic:`أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ`,transliteration:`A'udhu bikalimatil-lahit-tammati min sharri ma khalaq.`,translationEnglish:`I seek refuge in the perfect words of Allah from the evil of what He has created.`,translationUrdu:`میں اللہ کے کامل کلمات کی پناہ مانگتا ہوں ہر اس چیز کے شر سے جو اس نے پیدا کی۔`,category:`Protection`,reference:`Sahih Muslim 2708`,benefit:`Recited 3 times; guards against harmful creatures, evil eye, and sudden calamity.`},{id:`protection-bismillahilladhi`,title:`Dua Shielding Against Any Harm in Heavens or Earth`,arabic:`بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ`,transliteration:`Bismillahilladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa Huwas-Sami'ul-'Alim.`,translationEnglish:`In the Name of Allah, with whose Name nothing can cause harm in the earth nor in the heaven, and He is the All-Hearing, the All-Knowing.`,translationUrdu:`اللہ کے نام سے جس کے نام کی برکت سے زمین اور آسمان میں کوئی چیز نقصان نہیں پہنچا سکتی، اور وہی سب کچھ سننے والا اور جاننے والا ہے۔`,category:`Protection`,reference:`Abu Dawud 5088 & At-Tirmidhi 3388`,benefit:`Whoever recites this three times morning and evening will not be harmed by anything.`},{id:`travel-supplication`,title:`Supplication When Embarking on a Journey`,arabic:`سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ، اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَٰذَا الْبِرَّ وَالتَّقْوَىٰ`,transliteration:`Subhanal-ladhi sakh-khara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun. Allahumma inna nas'aluka fi safarina hadhal-birra wat-taqwa.`,translationEnglish:`Glory be to Him Who has brought this under our control, whereas we were unable to subdue it ourselves. And indeed to our Lord we will surely return. O Allah, we ask You in this journey of ours for righteousness and piety.`,translationUrdu:`پاک ہے وہ ذات جس نے اس (سواری) کو ہمارے قابو میں کر دیا ورنہ ہم اسے قابو میں لانے والے نہ تھے، اور بے شک ہمیں اپنے رب ہی کی طرف لوٹ کر جانا ہے۔ اے اللہ! ہم اپنے اس سفر میں نیکی اور تقویٰ کا سوال کرتے ہیں۔`,category:`Travel`,reference:`Sahih Muslim 1342 (Quran 43:13-14)`,benefit:`Provides divine safety during vehicle, flight, and road journeys.`},{id:`food-before-eating`,title:`Dua Before Beginning a Meal`,arabic:`بِسْمِ اللَّهِ وَعَلَى بَرَكَةِ اللَّهِ`,transliteration:`Bismillahi wa 'ala barakatillah.`,translationEnglish:`In the name of Allah and upon the blessing of Allah.`,translationUrdu:`اللہ کے نام کے ساتھ اور اللہ کی برکت پر شروع کرتا ہوں۔`,category:`Food`,reference:`Abu Dawud 3767 & Al-Hakim`,benefit:`Invokes barakah in food and protects against shaytan partaking.`},{id:`food-after-eating`,title:`Dua After Concluding a Meal`,arabic:`الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ`,transliteration:`Alhamdu lillahil-ladhi at'amana wa saqana wa ja'alana Muslimeen.`,translationEnglish:`All praise belongs to Allah Who fed us, gave us drink, and made us Muslims.`,translationUrdu:`تمام تعریفیں اللہ کے لیے ہیں جس نے ہمیں کھلایا، پلایا اور ہمیں مسلمان بنایا۔`,category:`Food`,reference:`Abu Dawud 3850 & At-Tirmidhi 3457`,benefit:`Deepens gratitude for sustenance and earns divine pleasure.`},{id:`forgiveness-adam`,title:`Supplication of Prophet Adam & Hawwa`,arabic:`رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ`,transliteration:`Rabbana thalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasireen.`,translationEnglish:`Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.`,translationUrdu:`اے ہمارے رب! ہم نے اپنی جانوں پر ظلم کیا اور اگر تو نے ہمیں نہ بخشا اور ہم پر رحم نہ فرمایا تو ہم یقیناً نقصان پانے والوں میں سے ہو جائیں گے۔`,category:`Forgiveness`,reference:`Surah Al-A'raf (7:23)`,benefit:`The primeval repentant plea that was accepted by Allah for Prophet Adam.`},{id:`forgiveness-rabbighfirli`,title:`Short Frequent Istighfar`,arabic:`رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ`,transliteration:`Rabbigh-fir li wa tub 'alayya, innaka Antat-Tawwabur-Rahim.`,translationEnglish:`My Lord, forgive me and accept my repentance, truly You are the Oft-Returning with compassion, the Ever-Merciful.`,translationUrdu:`اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما، بے شک تو ہی توبہ قبول فرمانے والا، نہایت رحم والا ہے۔`,category:`Forgiveness`,reference:`Abu Dawud 1516 & At-Tirmidhi 3434`,benefit:`The companions reported the Prophet (ﷺ) would count this supplication over 100 times in a single sitting.`},{id:`anxiety-yunus`,title:`Dua of Prophet Yunus (Dhun-Nun) in the Whale`,arabic:`لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ`,transliteration:`La ilaha illa Anta subhanaka inni kuntu minaz-zalimeen.`,translationEnglish:`There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.`,translationUrdu:`تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ہی قصورواروں میں سے تھا۔`,category:`Anxiety & Difficulties`,reference:"Surah Al-Anbiya (21:87) & Jami` at-Tirmidhi 3505",benefit:`The Prophet (ﷺ) stated no Muslim ever supplicates with this for any difficulty except that Allah removes their distress.`},{id:`anxiety-hamm-hazan`,title:`Relief from Grief, Worry, and Heavy Debt`,arabic:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ`,transliteration:`Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-bukhli wal-jubn, wa dala'id-dayni wa ghalabatir-rijal.`,translationEnglish:`O Allah, I seek refuge in You from grief and sorrow, weakness and laziness, miserliness and cowardice, the burden of debts, and being overpowered by men.`,translationUrdu:`اے اللہ! میں تیری پناہ مانگتا ہوں فکر اور غم سے، عاجزی اور سستی سے، بخل اور بزدلی سے، قرض کے بوجھ سے اور لوگوں کے دباؤ اور غلبے سے۔`,category:`Anxiety & Difficulties`,reference:`Sahih al-Bukhari 2893`,benefit:`A comprehensive shelter against mental despair and emotional burnout.`},{id:`parents-compassion`,title:`Dua for Mercy and Compassion on Parents`,arabic:`رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا`,transliteration:`Rabbir-hamhuma kama rabbayani sagheera.`,translationEnglish:`My Lord, have mercy upon them as they brought me up when I was small.`,translationUrdu:`اے میرے رب! ان دونوں پر رحم فرما جیسا کہ انہوں نے بچپن میں مجھے پالا اور پرورش کی۔`,category:`Parents`,reference:`Surah Al-Isra (17:24)`,benefit:`Divine instruction for lifelong devotion and prayers for both living and deceased parents.`},{id:`parents-forgiveness-believers`,title:`Supplication of Prophet Ibrahim for Parents`,arabic:`رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ`,transliteration:`Rabbanagh-fir li wa liwalidayya wa lil-mu'minina yawma yaqumul-hisab.`,translationEnglish:`Our Lord, forgive me and my parents and the believers the Day the account is established.`,translationUrdu:`اے ہمارے رب! مجھے اور میرے والدین کو اور تمام مومنوں کو اس دن بخش دینا جس دن حساب قائم ہو گا۔`,category:`Parents`,reference:`Surah Ibrahim (14:41)`,benefit:`Encompasses one's parents and the entire global community of believers.`},{id:`knowledge-zidni-ilman`,title:`Seeking Increase in Beneficial Knowledge`,arabic:`رَّبِّ زِدْنِي عِلْمًا`,transliteration:`Rabbi zidni 'ilma.`,translationEnglish:`My Lord, increase me in knowledge.`,translationUrdu:`اے میرے رب! میرے علم میں اضافہ فرما۔`,category:`Knowledge`,reference:`Surah Ta-Ha (20:114)`,benefit:`The only worldly thing Allah commanded His Messenger (ﷺ) to pray for an increase of.`},{id:`knowledge-nafi-rizq`,title:`Supplication for Useful Knowledge and Pure Sustenance`,arabic:`اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا`,transliteration:`Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbala.`,translationEnglish:`O Allah, I ask You for knowledge that is beneficial, provision that is good and pure, and deeds that are accepted.`,translationUrdu:`اے اللہ! میں تجھ سے نفع بخش علم، پاکیزہ رزق، اور قبول ہونے والے عمل کا سوال کرتا ہوں۔`,category:`Knowledge`,reference:`Sunan Ibn Majah 925 - Sahih`,benefit:`Recited every morning after Fajr prayer.`},{id:`health-afini-fi-badani`,title:`Dua for Well-being of Body, Hearing, and Sight`,arabic:`اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ`,transliteration:`Allahumma 'afini fi badani, Allahumma 'afini fi sam'i, Allahumma 'afini fi basari, la ilaha illa Anta.`,translationEnglish:`O Allah, grant me health in my body. O Allah, grant me health in my hearing. O Allah, grant me health in my sight. There is no deity except You.`,translationUrdu:`اے اللہ! مجھے میرے بدن میں عافیت دے، اے اللہ! مجھے میری سماعت میں عافیت دے، اے اللہ! مجھے میری بصارت میں عافیت دے، تیرے سوا کوئی معبود نہیں۔`,category:`Health`,reference:`Abu Dawud 5090 & Ahmad`,benefit:`Recited 3 times morning and evening for physical and sensory vitality.`},{id:`health-ruqyah-illness`,title:`Prophetic Healing Supplication for the Sick`,arabic:`أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا`,transliteration:`Adh-hibil-ba'sa Rabban-nas, washfi Antash-Shafi, la shifa'a illa shifa'uk, shifa'an la yughadiru saqama.`,translationEnglish:`Remove the disease, O Lord of mankind, and bring about healing; You are the Healer, there is no cure but Your cure, a healing that leaves no illness behind.`,translationUrdu:`تکلیف کو دور فرما دے اے انسانوں کے رب! اور شفا عطا فرما، تو ہی شفا دینے والا ہے، تیری شفا کے سوا کوئی شفا نہیں، ایسی شفا جو کسی بیماری کو باقی نہ چھوڑے۔`,category:`Health`,reference:`Sahih al-Bukhari 5743 & Muslim 2191`,benefit:`Recited over oneself or someone in illness with gentle touch.`},{id:`daily-leaving-home`,title:`Dua When Leaving the Home`,arabic:`بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ`,transliteration:`Bismillahi tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah.`,translationEnglish:`In the name of Allah, I place my trust in Allah; there is no might and no power except with Allah.`,translationUrdu:`اللہ کے نام کے ساتھ، میں نے اللہ پر بھروسہ کیا، اور گناہ سے بچنے اور نیکی کرنے کی طاقت اللہ کی توفیق کے بغیر نہیں۔`,category:`Daily Life`,reference:`Abu Dawud 5094 & At-Tirmidhi 3426`,benefit:`It is said to the person: You are guided, defended, and protected, and Satan retreats.`},{id:`daily-entering-home`,title:`Dua When Entering the Home`,arabic:`بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا`,transliteration:`Bismillahi walajna, wa bismillahi kharajna, wa 'ala Rabbina tawakkalna.`,translationEnglish:`In the name of Allah we enter, and in the name of Allah we leave, and upon our Lord we place our trust.`,translationUrdu:`ہم اللہ کے نام سے داخل ہوئے اور اللہ کے نام سے نکلے، اور اپنے رب پر ہی ہم نے توکل کیا۔`,category:`Daily Life`,reference:`Sunan Abi Dawud 5096`,benefit:`Brings peace and angels' presence into the household.`}],wt=[`Quran`,`Hadith`,`Seerah`,`Salah`,`Fasting`,`Zakat`,`Hajj`,`Islamic Manners`,`Islamic History`,`Family & Relationships`],Tt=[{id:`preservation-of-quran`,title:`The Preservation and Compilation of the Holy Quran`,category:`Quran`,readTime:`6 min read`,date:`Sep 24, 2026`,summary:`An exploration of how the Holy Quran was divinely protected, memorized in hearts, transcribed during the Prophetic era, and standardized under Caliph Uthman ibn Affan (RA).`,content:[`The Holy Quran occupies a unique position in religious history as the only scripture whose original text remains completely verbatim, intact, and universally identical down to every letter and vowel since its revelation over 1,400 years ago.`,`During the lifetime of Prophet Muhammad (ﷺ), revelation was recorded instantaneously by designated scribes, including Zaid ibn Thabit, Ali ibn Abi Talib, and Ubayy ibn Ka'b. Simultaneously, thousands of companions memorized the text continuously, establishing dual preservation: in written parchment and within living hearts (Huffadh).`,`During the caliphate of Abu Bakr as-Siddiq (RA), following the Battle of Yamama, the verses were compiled into an authorized codex (Suhuf) under the rigorous verification of Zaid ibn Thabit, requiring two independent eyewitnesses for every inscribed ayah.`,`Later, Caliph Uthman (RA) unified the Muslim world upon the standardized Qurayshi dialectal orthography (the Uthmanic Mushaf), dispatching official copies across the major centers of the Islamic civilization. Today, millions of Muslims across continents recite the exact same scripture with unwavering fidelity.`],keyPoints:[`Dual preservation through oral transmission (Tawatur) and meticulous written records.`,`The role of the Sahabah in recording revelation during the Prophet's life.`,`The compilation committee established under Abu Bakr (RA) and finalized under Uthman (RA).`,`Divine guarantee declared in Surah Al-Hijr: 'Indeed, it is We who sent down the Qur'an and indeed, We will be its guardian.'`],source:`Tafsir Ibn Kathir & Al-Itqan fi Ulum al-Quran (Imam al-Suyuti)`,tags:[`Quran`,`Tafsir`,`Preservation`,`Islamic History`,`Uthmanic Mushaf`]},{id:`understanding-hadith-sciences`,title:`Understanding Hadith Sciences: The Architecture of Isnad & Matn`,category:`Hadith`,readTime:`7 min read`,date:`Sep 21, 2026`,summary:`A structured guide to the rigorous methodologies developed by classical scholars to authenticate the sayings and traditions of Prophet Muhammad (ﷺ).`,content:[`The science of Hadith verification (Mustalah al-Hadith) represents one of the greatest intellectual achievements of Islamic scholarship, creating an unprecedented critical methodology for historical verification.`,`Every Hadith consists of two inseparable components: the Isnad (the unbroken chain of narrators linking back to the Prophet) and the Matn (the actual text of the narration).`,`To deem a narration Sahih (authentic), classical muhaddithin like Imam al-Bukhari and Imam Muslim required five stringent criteria: unbroken continuity of transmission (Ittisal al-Sanad), moral integrity of each narrator ('Adalah), photographic accuracy and memory retention (Dabt), absence of rare anomalies (Shudhudh), and absence of hidden defects ('Illah Qadihah).`,`Biographical evaluation (Ilm ar-Rijal) scrutinized the lives, morals, teachers, travels, and reputations of over 100,000 transmitters, ensuring fabricated or weak reports were systematically cataloged and distinguished from sound teachings.`],keyPoints:[`The distinction between Sahih (authentic), Hasan (good), Da'if (weak), and Mawdu' (fabricated).`,`The five rigorous conditions for a narration to achieve Sahih status.`,`The biographical evaluation science of Ilm ar-Rijal.`,`The canonical six books (Kutub al-Sittah) and their standard of scholarship.`],source:`Muqaddimah Ibn al-Salah & Tadrib al-Rawi (Al-Suyuti)`,tags:[`Hadith`,`Sunnah`,`Bukhari`,`Muslim`,`Isnad`]},{id:`mercy-of-the-prophet`,title:`The Character and Compassion of Prophet Muhammad (ﷺ)`,category:`Seerah`,readTime:`8 min read`,date:`Sep 18, 2026`,summary:`Reflecting on the exemplary empathy, forgiveness, and timeless moral excellence of the Messenger sent as a mercy to all creation.`,content:[`The Quran encapsulates the divine mission of Prophet Muhammad (ﷺ) in a single definitive statement: 'And We have not sent you, [O Muhammad], except as a mercy to the worlds' (Al-Anbiya 21:107).`,`His mercy was not an abstract ideal; it was manifest in everyday interactions with the marginalized, the orphaned, opponents, animals, and the natural environment.`,`At the city of Ta'if, when bloodied and rejected by its leaders, the Angel of the Mountains offered to crush the valley between two peaks. The Prophet (ﷺ) responded with legendary patience: 'No, rather I hope that Allah will bring from their descendants those who will worship Him alone.'`,`During the Conquest of Makkah, standing victorious before those who had persecuted his family, boycotted his companions, and martyred his loved ones, he declared the words of Prophet Yusuf: 'No blame will there be upon you today. Go, for you are free.'`],keyPoints:[`Mercy as the foundational compass of Prophetic conduct.`,`Unparalleled forgiveness at the Conquest of Makkah.`,`Kindness towards children, animals, servants, and vulnerable members of society.`,`The embodiment of the Quran in daily character as described by Aisha (RA).`],source:`Ar-Raheeq Al-Makhtum (The Sealed Nectar) & Ash-Shifa by Qadi Ayyad`,tags:[`Seerah`,`Prophet Muhammad`,`Mercy`,`Akhlaq`,`Patience`]},{id:`spiritual-architecture-of-salah`,title:`The Spiritual Architecture of Salah: Finding Deep Khushu`,category:`Salah`,readTime:`5 min read`,date:`Sep 15, 2026`,summary:`Practical and spiritual strategies to transform routine physical movements into a conscious dialogue with the Divine.`,content:[`Salah is described by the Prophet (ﷺ) as the pinnacle of worship and the coolness of his eyes. Yet for many modern believers surrounded by digital distractions, achieving inner presence (Khushu) can feel challenging.`,`The journey into Khushu begins before the prayer itself: through deliberate Wudu with mindfulness, disconnecting mentally from worldly notifications, and reflecting on the majestic words of the Adhan.`,`Standing on the prayer rug, Takbiratul Ihram ('Allahu Akbar') signifies casting every anxiety, deadline, and worldly attachment behind your back, acknowledging that Allah is greater than anything competing for your attention.`,`When bowing in Ruku, the back is leveled in physical humility; when descending into Sujud, the servant is closest to their Creator, pouring out the innermost whispers of the heart in intimate communion.`],keyPoints:[`Mindful preparation through reflective Wudu and tranquil walking to prayer.`,`Understanding the linguistic meaning of every word recited during prayer.`,`Pacing the recitation and pausing at each verse of Surah Al-Fatihah.`,`Sujud as the station of highest spiritual proximity.`],source:`Asrar al-Salah (Ibn Qayyim al-Jawziyya) & Ihya Ulum al-Din (Al-Ghazali)`,tags:[`Salah`,`Khushu`,`Prayer`,`Spirituality`,`Worship`]},{id:`inner-dimensions-of-fasting`,title:`The Inner Dimensions and Spiritual Secrets of Sawm (Fasting)`,category:`Fasting`,readTime:`6 min read`,date:`Sep 12, 2026`,summary:`Beyond refraining from nourishment: How fasting cultivates Taqwa, cleanses the soul, and awakens empathetic brotherhood.`,content:[`Fasting in Islam (Sawm) is far more than physical deprivation from dawn to sunset; it is an intensive spiritual recalibration designed to liberate the spirit from the tyranny of subconscious desires.`,`Imam al-Ghazali classified fasting into three distinct levels: the fasting of the general public (refraining from food, drink, and intimacy), the fasting of the pious (safeguarding the eyes, tongue, ears, and hands from sins), and the fasting of the spiritually elect (fasting of the heart from worldly preoccupations).`,`When hunger touches the believer, empathy for the impoverished shifts from an intellectual concept into a visceral reality. The pangs of thirst become a quiet reminder of dependence on Allah's daily gifts.`,`The Prophet (ﷺ) warned: 'Whoever does not leave false speech and acting upon it, Allah has no need in him leaving his food and drink.' True fasting produces self-restraint and spiritual lightness.`],keyPoints:[`The primary purpose of fasting: attaining God-consciousness (Taqwa).`,`The three tiers of fasting outlined by classical scholars.`,`Protecting the tongue, ears, and senses from unproductive speech.`,`The health, physiological, and emotional rejuvenation of voluntary and Ramadan fasts.`],source:`Ihya Ulum al-Din (Imam al-Ghazali) & Lata'if al-Ma'arif (Ibn Rajab)`,tags:[`Fasting`,`Ramadan`,`Sawm`,`Taqwa`,`Self-discipline`]},{id:`zakat-social-justice`,title:`Zakat: The Divine Pillar of Social Justice and Wealth Purification`,category:`Zakat`,readTime:`5 min read`,date:`Sep 09, 2026`,summary:`How the annual 2.5% wealth obligation eliminates economic stagnation, cleanses greed, and dignifies the less fortunate.`,content:[`Zakat is linguistically rooted in the Arabic concepts of 'purification' and 'growth'. In the Islamic socioeconomic paradigm, wealth does not belong exclusively to humans; we are trustees over provisions bestowed by Allah.`,`By mandating that 2.5% of surplus wealth held over a full lunar year above the Nisab threshold be redistributed to the eight specific Quranic categories of beneficiaries, Islam ensures circulation of capital.`,`Unlike conventional taxation, Zakat is a spiritual act of worship that purifies the giver's heart from hoarding and stinginess while preserving the dignity and financial stability of the recipient.`,`When instituted faithfully in Islamic history, such as during the caliphate of Umar ibn Abd al-Aziz, prosperity spread so comprehensively that collectors struggled to find a single person in need of Zakat funds.`],keyPoints:[`Nisab thresholds based on gold and silver standards.`,`The eight eligible categories of recipients defined in Surah At-Tawbah (9:60).`,`Economic benefits: preventing wealth concentration and fostering communal cohesion.`,`The difference between obligatory Zakat and voluntary charity (Sadaqah).`],source:`Fiqh al-Zakat (Dr. Yusuf al-Qaradawi) & Al-Majmu (Imam an-Nawawi)`,tags:[`Zakat`,`Charity`,`Social Justice`,`Economics`,`Pillars of Islam`]},{id:`journey-of-hajj`,title:`The Journey of a Lifetime: Spiritual Stages of Hajj`,category:`Hajj`,readTime:`7 min read`,date:`Sep 05, 2026`,summary:`Tracing the footsteps of Prophet Ibrahim, Hajar, and the Prophet Muhammad (ﷺ) through the sacred rites of Makkah, Mina, Arafat, and Muzdalifah.`,content:[`Hajj is the grand pilgrimage uniting millions of Muslims from every ethnicity, language, and continent into a single sea of devotion, stripping away all indicators of rank, royalty, and social stature.`,`Entering the state of Ihram, wearing two simple white unstitched cloths, is a vivid rehearsal for the Day of Judgment. The millionaire stands shoulder-to-shoulder with the laborer, chanting the timeless Talbiyah: 'Labbayk Allahumma Labbayk' (Here I am, O Allah, here I am).`,`The climax of Hajj takes place on the plains of Mount Arafat. The Prophet (ﷺ) declared: 'Hajj is Arafah.' Believers stand from noon until sunset in sincere repentance, tears, and supplication, seeking divine absolution.`,`The Tawaf around the sacred Kaaba symbolizes celestial harmony, echoing the perpetual circumambulation of angels around the heavenly throne (Al-Bayt al-Ma'mur).`],keyPoints:[`The unifying power of the Ihram garments.`,`The core significance of the Day of Arafah as the pillar of Hajj.`,`Reliving the resilience and trust of Hajar between Safa and Marwah (Sa'i).`,`The symbolic rejection of temptation during the Stoning of the Jamarat.`],source:`Al-Hajj wal-Umrah fi Daw' al-Kitab was-Sunnah & Fiqh as-Sunnah`,tags:[`Hajj`,`Pilgrimage`,`Makkah`,`Arafat`,`Kaaba`]},{id:`etiquette-and-manners`,title:`Adab & Akhlaq: The Islamic Etiquette in Daily Life`,category:`Islamic Manners`,readTime:`5 min read`,date:`Sep 02, 2026`,summary:`The noble principles of speech, neighborly conduct, humility, and greeting that reflect genuine faith.`,content:[`Prophet Muhammad (ﷺ) famously said: 'I was sent only to perfect noble character (Makarim al-Akhlaq).' Islam teaches that true religiosity is reflected primarily in how one treats others.`,`Islamic etiquette (Adab) encompasses every sphere of human engagement: spreading the greeting of peace (Salam), smiling as an act of charity, guarding secrets, respecting privacy, and avoiding backbiting (Gheebah).`,`The rights of neighbors are so emphasized in Prophetic traditions that the Messenger (ﷺ) remarked: 'The Angel Jibreel continued to advise me concerning the neighbor until I thought he would give him a share of inheritance.'`,`Speaking with kindness, listening attentively, controlling anger, and honoring guests are not mere cultural courtesies; they are vital indices of sincere faith.`],keyPoints:[`The inseparable link between strong Iman (faith) and noble Akhlaq (character).`,`The virtue of spreading the greeting of Salam.`,`The inviolable sanctity of people's honor and the prohibition of backbiting.`,`The sacred duties owed to neighbors regardless of their creed.`],source:`Al-Adab al-Mufrad (Imam al-Bukhari) & Riyad as-Salihin (Imam an-Nawawi)`,tags:[`Manners`,`Akhlaq`,`Adab`,`Kindness`,`Community`]},{id:`golden-age-of-islamic-thought`,title:`The Golden Age of Islamic Science, Medicine, and Philosophy`,category:`Islamic History`,readTime:`8 min read`,date:`Aug 28, 2026`,summary:`How Islamic civilization bridged antiquity and modernity, pioneering optics, algebra, surgical medicine, and astronomy grounded in faith.`,content:[`Guided by the Quranic imperative to observe, contemplate, and seek knowledge ('Read in the name of your Lord who created'), early Islamic scholars sparked an era of groundbreaking scientific inquiry from Baghdad and Cairo to Cordoba and Samarkand.`,`In mathematics, Muhammad ibn Musa al-Khwarizmi formulated algebra (from 'Al-Jabr') and algorithms, enabling modern computing foundations.`,`In medicine, Ibn Sina (Avicenna) authored The Canon of Medicine, which remained the paramount medical textbook in European and Eastern universities for over five centuries. Al-Zahrawi pioneered surgical instruments still recognized in operating rooms today.`,`Ibn al-Haytham founded modern optics through rigorous experimental methodology, dismantling Greek conjectures and discovering the principles of light refraction and cameras (Qamara).`],keyPoints:[`The Quranic inspiration behind empirical scientific exploration.`,`The House of Wisdom (Bayt al-Hikmah) in Baghdad as a global translation and research hub.`,`Pioneers in mathematics, medicine, astronomy, and optics.`,`The preservation and advancement of knowledge that sparked the Renaissance.`],source:`Lost Islamic History (Firas Alkhateeb) & 1001 Inventions: The Enduring Legacy`,tags:[`History`,`Science`,`Golden Age`,`Medicine`,`Civilization`]},{id:`ties-of-kinship-and-family`,title:`Rights of Parents and Maintaining Ties of Kinship (Silat al-Rahim)`,category:`Family & Relationships`,readTime:`6 min read`,date:`Aug 24, 2026`,summary:`The sacred status of parents in the Quran and the boundless spiritual and worldly rewards of maintaining loving family bonds.`,content:[`In several Quranic passages, Allah pairs the command to worship Him alone directly with the command to treat parents with supreme kindness (Ihsan), illustrating that honoring parents is secondary only to Monotheism.`,`The Quran instructs: 'And your Lord has decreed that you not worship except Him, and to parents, good treatment. Whether one or both of them reach old age with you, say not to them so much as 'uff' and do not repel them but speak to them a noble word' (Surah Al-Isra 17:23).`,`A companion asked the Messenger of Allah (ﷺ): 'Who among people is most deserving of my fine companionship?' The Prophet replied: 'Your mother.' The man asked: 'Then who?' He replied: 'Your mother.' The man asked: 'Then who?' He replied: 'Your mother.' The man asked: 'Then who?' He replied: 'Then your father.'`,`Maintaining ties of kinship (Silat al-Rahim) extends to siblings, aunts, uncles, and cousins. The Prophet (ﷺ) noted that whoever wishes for expansion in their sustenance and longevity in life should maintain family bonds.`],keyPoints:[`The divine pairing of Tawheed with dutifulness to parents (Birr al-Walidayn).`,`The unmatched three-fold station granted to mothers in Islam.`,`Avoiding expressions of irritation ('uff') towards aging parents.`,`Silat al-Rahim as a source of longevity, barakah, and answered prayers.`],source:`Sahih al-Bukhari (Book of Manners) & Tafsir al-Qurtubi`,tags:[`Family`,`Parents`,`Kinship`,`Motherhood`,`Relationships`]}],Et=()=>{let{isSearchOpen:e,setIsSearchOpen:t,navigateToSurah:n,setActivePage:r,setSelectedArticleId:i}=x(),[a,o]=(0,_.useState)(``),[s,c]=(0,_.useState)(`all`),l=(0,_.useRef)(null);(0,_.useEffect)(()=>{e&&setTimeout(()=>l.current?.focus(),50)},[e]),(0,_.useEffect)(()=>{let n=n=>{(n.ctrlKey||n.metaKey)&&n.key.toLowerCase()===`k`&&(n.preventDefault(),t(!0)),n.key===`Escape`&&e&&t(!1)};return window.addEventListener(`keydown`,n),()=>window.removeEventListener(`keydown`,n)},[e,t]);let u=[`Ayat al-Kursi`,`Al-Fatihah`,`Sayyidul Istighfar`,`Khushu in Salah`,`Surah Al-Mulk`,`Prophet Muhammad`,`Forgiveness`,`Travel Dua`],d=(0,_.useMemo)(()=>{let e=a.trim().toLowerCase();if(!e)re
